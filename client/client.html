<!DOCTYPE html>
<html lang="en">

<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">

  <script>

    //Handles our FETCH response. This function is async because it
    //contains an await.
    const handleResponse = async (response) => {

      //Grab the content section
      const content = document.querySelector('#content');

      //Based on the status code, display something
      switch (response.status) {
        case 200: //success
          content.innerHTML = `<b>Success</b>`;
          break;
        case 401: //Unauthorized
          content.innerHTML = '<b>Unauthorized</b>';
          break;
        case 403: //Forbidden
          content.innerHTML = '<b>Forbidden</b>';
          return;
        case 400: //bad request
          content.innerHTML = `<b>Bad Request</b>`;
          break;
        case 500: //internal
          content.innerHTML = `<b>Internal Error</b>`;
          break;
        case 501:
          content.innerHTML = `<b>Request Not Implemented</b>`;
          break;
        case 404:
          content.innerHTML = `<b>Page Not Found</b>`;
          break;
        default: //any other status code
          content.innerHTML = `Error code not implemented by client.`;
          break;
      }

      const contentType = response.headers.get('content-type') || '';

      // for XML
      if (contentType.includes('xml')) {
        const text = await response.text();

        // parse xml data
        const xml = new window.DOMParser().parseFromString(text, 'text/xml');
        const messageEl = xml.querySelector('message');
        if (messageEl) {
          content.innerHTML += `<p>${messageEl.textContent}</p>`;
        }
      } else {
        const obj = await response.json();
        if (obj.message) {
          // if there is a message, grab it
          content.innerHTML += `<p>${obj.message}</p>`;
        }
      }
    };

    //Uses fetch to send a postRequest. Marksed as async because we use await
    //within it.
    const sendPost = async (statusCodeType, responseFormat) => {
      //Grab all the info from the form
      //const url = statusCodeType.getAttribute('action');
      const url = statusCodeType.value;
      const reponseFormatValue = responseFormat.value;

      //Build a data string in the FORM-URLENCODED format.
      let formData = `statudCode=${url}`;

      //If the user selected JSON, send that instead
      if (reponseFormatValue === 'application/json') {
        formData = JSON.stringify({ url });
      }

      //Make a fetch request and await a response. Set the method to
      //the one provided by the form (POST). Set the headers. Content-Type
      //is the type of data we are sending. Accept is the data we would like
      //in response. Then add our FORM-URLENCODED string as the body of the request.
      const response = await fetch(url, {
        method: "GET",
        headers: {
          'Content-Type': reponseFormatValue,
          'Content-Length': formData.length,
          'Accept': reponseFormatValue,
        }
      });

      //Once we have a response, handle it.
      handleResponse(response);
    };


    //Init function is called when window.onload runs (set below).
    const init = () => {
      console.log("INIT")
      //Grab the form
      const statusCodeType = document.querySelector('#page');
      const responseFormat = document.querySelector('#type');
      const sendButton = document.querySelector('#send');

      //Create an getResponseCode function that cancels the forms default action and
      //calls our sendPost function above.
      const getResponseCode = (e) => {
        e.preventDefault();
        sendPost(statusCodeType, responseFormat);
        return false;
      }

      //Call getResponseCode when the submit event fires on the form.
      sendButton.addEventListener('click', getResponseCode);
    };

    //When the window loads, run init.
    window.onload = init;
  </script>
</head>

<body>
  <section id="top">
    <h3>Status Code Tests</h3>
    <select id="page">
      <option value="/success">Success</option>
      <option value="/badRequest">Bad Request</option>
      <option value="/unauthorized">Unauthorized</option>
      <option value="/forbidden">Forbidden</option>
      <option value="/internal">Internal</option>
      <option value="/notImplemented">Not Implemented</option>
      <option value="/notFound">Not Found</option>
    </select>
    <select id="type">
      <option value="application/json">JSON</option>
      <option value="text/xml">XML</option>
    </select>
    <button id="send">Send</button>
  </section>
  <section id="content">
  </section>
</body>

</html>
